name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix frontend
          npm ci --prefix backend
      - name: Lint frontend
        run: npm run lint --prefix frontend
      - name: Build storefront (SSR)
        run: npm run build --prefix frontend
      - name: Build Capacitor app bundle (SPA)
        run: npm run build:spa --prefix frontend
      - name: Check backend
        working-directory: backend
        run: |
          for f in $(find src scripts -name '*.js'); do node --check "$f"; done
          node -e "import('./src/app.js').then(() => process.exit(0)).catch((e) => { console.error(e); process.exit(1); })"

  e2e:
    name: End-to-end (smoke + SEO)
    runs-on: ubuntu-latest
    needs: build
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/marketplus
      JWT_SECRET: ci_jwt_secret_that_is_at_least_32_characters
      CLIENT_URL: http://localhost:3000
      SMS_DEV_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix frontend
          npm ci --prefix backend
          npx playwright install --with-deps chromium
      - name: Seed database
        run: npm run seed --prefix backend
      - name: Build storefront
        run: npm run build --prefix frontend
      - name: Start API and storefront
        run: |
          (cd backend && PORT=5001 node src/server.js > ../api.log 2>&1 &)
          (cd frontend && PORT=3000 NODE_ENV=production API_PROXY_TARGET=http://127.0.0.1:5001 node server.js > ../web.log 2>&1 &)
          npx --yes wait-on -t 60000 http://127.0.0.1:5001/api/health http://127.0.0.1:3000/robots.txt
      - name: Playwright
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_BROWSER_CHANNEL: chromium
      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test-results
            api.log
            web.log
